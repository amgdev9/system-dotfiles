[terminal.shell]
program = "tmux"
args = ["new-session", "-A", "-s", "amg"]

[window]
startup_mode = "Fullscreen"

[font]
normal = { family = "Hack Nerd Font Mono", style = "Regular" }
size = 12

[keyboard]
bindings = [{ key = "V", mods = "Control", action = "Paste" }]

[bell.command]
program = "paplay"
args = ["/home/amg/.config/alacritty/bell.wav"]
